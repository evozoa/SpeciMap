name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Requires repo secrets:
#   CLOUDFLARE_API_TOKEN  (Pages:Edit permission)
#   CLOUDFLARE_ACCOUNT_ID
#   VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY
# Create the Pages project once with: npx wrangler pages project create specimap
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_ORIGIN: https://specimap.org
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=specimap
