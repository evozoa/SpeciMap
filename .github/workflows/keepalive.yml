name: Supabase keep-alive

# The Supabase free tier pauses projects after ~7 idle days; a paused
# project breaks tag scanning. A ping every 3 days keeps it warm.
on:
  schedule:
    - cron: '17 8 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" > /dev/null
