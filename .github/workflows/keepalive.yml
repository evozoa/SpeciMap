name: Supabase keep-alive

# The Supabase free tier pauses projects after ~7 idle days; a paused
# project breaks tag scanning. A ping every 3 days keeps it warm.
on:
  schedule:
    - cron: '17 8 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Query a real table: the /rest/v1/ root now rejects the anon key (401).
      # RLS returns an empty list, but the request still reaches Postgres.
      - run: |
          curl -sf "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/tag_batches?select=id&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" > /dev/null
